    /*

    */

    let stations2 = [
        {   name: "HatKid SpaceHub",
            music:[...data.Hatkid_SpaceHub],
            gapless:true
        }
    ]
    let radio = document.getElementById("rad")
    radio.stations = stations
    window.timeChkStatus = {
        hour: new Date().getHours(),
        firstQtr:false,
        secondQtr:false,
        thirdQtr:false
    }
    radio.onready = ()=>{ //enables audioElem to play balanced audio
        console.log("RADIO READY")
        let stations = radio.getElementsByTagName("audio")
        for(let i=0;i<stations.length;i++){
            console.log(stations[i])
            stations[i].setupNormalizedPlayer()
        }
    }
    radio.onwait = ()=>{
        console.log("WAITING")
    }
    radio.onpause = ()=>{
        console.log("PAUSED")
    }
    radio.onend = ()=>{
        console.log("ENDED")

        if(Math.floor(Math.random() * 600))return       
        radio.interrupt()

        let synth = window.speechSynthesis
        let voices = synth.getVoices()
        const update = new SpeechSynthesisUtterance()
        
        let d = new Date()
        let HH = d.getHours() > 12 ? d.getHours() - 12 : d.getHours() == 0 ? 12 : d.getHours()
        let MM = d.getMinutes()
        
        let chkTime = ()=>{
            let partOfTheDay
            if(d.getHours() >= 5 && d.getHours() < 12){ //morning
                partOfTheDay = " in the morning"
            } else if (d.getHours() >= 12 && d.getHours() < 18){ //afternoon
                partOfTheDay = " in the afternoon"
            } else if (d.getHours() >= 18 && d.getHours() < 20){ //evening
                partOfTheDay = " in the evening"
            } else { //night
                partOfTheDay = " at night"
            }

            update.text = "It is now, " + HH + ", " + MM + partOfTheDay
            update.onend = ()=>{
                // console.log("SYNTH DONE")
                radio.resume()
                update.onend = ()=>{}
            }
            synth.speak(update)
        }
        if(MM <= 15 && !window.timeChkStatus.firstQtr){ //ex 5:03 3 minutes past 5 oclock
            window.timeChkStatus.firstQtr = true
            chkTime()
        } else if (MM >= 45 && !window.timeChkStatus.thirdQtr){ //ex 5:53 7 minutes before 6 oclock
            window.timeChkStatus.thirdQtr = true
            chkTime()
        } else if (MM > 15 && MM < 45 && !window.timeChkStatus.secondQtr){ // for time mostly between 16-44 minutes
            window.timeChkStatus.secondQtr = true
            chkTime()
        } else {
            
            if(HH <= window.timeChkStatus.hour){
                // console.log("duplicate Timechk prevented")
                radio.resume()
                update.onend = ()=>{}
                return null
            } else {
                // console.log("reseting")
                window.timeChkStatus = {
                    firstQtr:false,
                    secondQtr:false,
                    thirdQtr:false
                }
                if(MM <= 15){ //ex 5:03 3 minutes past 5 oclock
                    window.timeChkStatus.firstQtr = true
                    chkTime()
                } else if (MM >= 45){ //ex 5:53 7 minutes before 6 oclock
                    window.timeChkStatus.thirdQtr = true
                    chkTime()
                } else { // for time mostly between 16-44 minutes
                    window.timeChkStatus.secondQtr = true
                    chkTime()
                }
            }

        }
    
    }
    radio.onplay = ()=>{
        console.log("PLAYED")
    }
    radio.ontimeupdate = (e)=>{
        // console.log(24)

    }
</script>
