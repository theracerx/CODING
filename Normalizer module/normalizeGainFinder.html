<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #startScreen{
        position: absolute;
        top:0;
        left:0;
        background: rgba(124, 124, 124, .75);
        width: 100%;
        height: 100%;
        z-index: 999;
    }
    #startBtn{
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: auto;
        width: 200px;
        height: 100px;
        font-size: xxx-large;
    }
</style>
<body>
    <div id="startScreen">
        <button id="startBtn" onpointerup="start()" ><strong>START</strong></button>
    </div>
    <label for="src"><strong>SRC:</strong></label>
    <input id="src" type="text" style="width:50%;"placeholder="sample-a.mp3" value="sample-a.mp3">
    
    <button onpointerup="convert()">Submit</button>
    <button onpointerup="checkArray()">Submit Array</button>

    <p><strong>NOTE:</strong> when submitting arrays do:  a,b,c,d,e,f,g,h </p>
    <p><strong>Windows USER:</strong> audios in folder? go in folder and do "<strong>cmd</strong>" in URL and type "<strong>dir /B |clip</strong>" and paste to Notepad </p>

    <h1>Original:</h1>
        <audio id="pl1" controls></audio>
    <h1>Normalized:</h1>
        <audio id="pl2" controls></audio>
        <br>

        <label for="gain">Gain</label>
        <input id="gain" type="text" placeholder="1" value="1" onkeyup="onEnter2()" >
        <button onpointerup="updateGain()">Submit</button>

    <h1>New link: <i id="nLink" style="color:green;" >null</i></h1>
        <button id="prevBtn" onpointerup="prevArray()" hidden="true"><< Prev <<</button>
        <span id="arrCount" data-count="0"></span>
        <button id="nextBtn" onpointerup="nextArray()" hidden="true">>> Next >></button>
        <!-- <button id="convertAllBtn" onclick="convertAll()" hidden>Convert All</button> -->
        <button onpointerup="copyLink()">Copy Link</button>

        
        <br><!-- FOR DECIBEL DISPLAY -->
        <label for="prog">Decibel meter:</label>
         <progress id="prog" value="0" max="1"></progress> <span id="db1"> 0 </span>
        <input type="button" value="Reset" onpointerup="reset()">
        <br>
    <h2>History:</h2>
    <p id="codeStash"></p>
    <button onpointerup="sortHistoryUp()">Sort Up</button>
    <button onpointerup="sortHistoryDown()">Sort Down</button>
    <button onpointerup="copyHistory()">Copy History</button>
</body>
<script>

var audGainNode
var audSrcNode
var eventSetup
window.audHistory = []


function start(){
    document.getElementById("startScreen").remove()
    window.audioCtx = new AudioContext()
}

function convert(cSrc){
    let src

    if(cSrc){
        src = cSrc
    } else src = document.getElementById("src").value


    let player = document.getElementsByTagName("audio")
    let normalGain

    player[0].src = src
    fetch(player[0].src)
    .then(res => res.blob())
    .then(blob => blob.arrayBuffer())
    .then(buf => audioCtx.decodeAudioData(buf))
    .then(decodedData => {
        // Normalize calculations
        var decodedBuffer = decodedData.getChannelData(0);
        var sliceLen = Math.floor(decodedData.sampleRate * 0.05);
        var averages = [];
        var sum = 0.0;
        for (var i = 0; i < decodedBuffer.length; i++) {
            sum += decodedBuffer[i] ** 2; 
            if (i % sliceLen === 0) {
                sum = Math.sqrt(sum / sliceLen);
                averages.push(sum);
                sum = 0;
            }
        }
        // Ascending sort of the averages array
        averages.sort(function(a, b) { return a - b; });
        // Take the average at the 95th percentile
        var a = averages[Math.floor(averages.length * 0.95)];

        //set new gain
        normalGain = ((1.0 / a) / 10).toPrecision(4)

        //setup Normalized player
        player[1].src = src
        document.getElementById("gain").value = normalGain
        let url = chkURL() + "?gain=" + normalGain

       url = String.raw`${url}`.replaceAll("\\","/")
       console.log(url)

        document.getElementById("nLink").textContent = url
        let stash = document.getElementById("codeStash")
        
        if(!stash.textContent.includes(url)){ //only saves once in history
            window.audHistory.push(url)
            stash.textContent = stash.textContent + `"` + url + `",`
        }

        //set AudioSourceNode
        if(!audSrcNode){
            audSrcNode = audioCtx.createMediaElementSource(player[1]);
        }
    
        //set GainNode
        if(!audGainNode){
            audGainNode = audioCtx.createGain()
        }
        audGainNode.gain.value = normalGain
    
        //set processor //FOR SHOWING DECIBELS
        let processor = audioCtx.createScriptProcessor(2048, 1, 1)
        processor.onaudioprocess = function(evt){
            var input = evt.inputBuffer.getChannelData(0)
            , len = input.length   
            , total = i = 0
            , rms;
            while ( i < len ) total += Math.abs( input[i++] );
            rms = Math.sqrt( total / len );

            let db = Math.round((rms * 100)* 100) / 100
            // document.getElementById("db0").textContent = db
            document.getElementById("prog").value = db
            
            if(db >  document.getElementById("prog").max){
                document.getElementById("prog").max = db
                document.getElementById("db1").textContent = db
            }

        };
        //setup connect and disconnect funcs

        let connectNode = ()=>{
            console.log("connecting node")
            audSrcNode.connect(audGainNode)
            audSrcNode.connect(processor)
            audGainNode.connect(audioCtx.destination)
            processor.connect(audioCtx.destination);
        }

        let disconnectNode = ()=>{
            console.log("disconnecting node")
            audSrcNode.disconnect(audGainNode)
            audSrcNode.disconnect(processor)
            audGainNode.disconnect(audioCtx.destination)
            processor.disconnect(audioCtx.destination);
        }
        
        //set Events
        if(!eventSetup){
            eventSetup = true
            player[1].addEventListener("play",async(e)=>{  // isSrcReady???
                connectNode()
            })
            player[1].addEventListener("pause",async(e)=>{
                disconnectNode()
            })
        }

    })
}
function checkArray(){
    document.getElementById("prevBtn").hidden = false
    document.getElementById("nextBtn").hidden = false
    // document.getElementById("convertAllBtn").hidden = false


    let arr = document.getElementById("src").value
    let arr1 = arr.split(",")
    window.arr2 = []
    for(let i=0;i<arr1.length;i++){
        // console.log(arr1[i].replace(/^[ \t]+|[ \t]+$/,""))
        let temp = arr1[i].replace(/^[ \t]+|[ \t]+$/,"")
        if(temp.includes(`"`)){
            arr2.push(temp.substring(1,temp.length-1))
        } else arr2.push(temp)
    }
    document.getElementById("arrCount").textContent = "0/" + (arr2.length)
    document.getElementById("arrCount").dataset.count = 0
    document.getElementById("arrCount").dataset.max = arr2.length
    convertAll()
}
function nextArray(){
    let count = document.getElementById("arrCount")
    count.dataset.count++
    let i = count.dataset.count - 1
    convert(arr2[i])
    count.textContent = count.dataset.count + "/" + (arr2.length)
}
function prevArray(){
    let count = document.getElementById("arrCount")
    count.dataset.count--
    let i = count.dataset.count - 1
    console.log(arr2[i])
    convert(arr2[i])
    count.textContent = count.dataset.count + "/" + (arr2.length)
}
async function convertAll(){
    let limit = document.getElementById("arrCount").dataset.max
    let i = 0;
    let test = ()=>{
        return new Promise ((resolve)=>{
            setTimeout(()=>{
                nextArray()
                resolve()
            },(Math.floor(Math.random() * 3) + 1) * 1000)
        })
    }
    while (i < limit) {
        await test()
        i++
    }
}
function updateGain(){
    audGainNode.gain.value = document.getElementById("gain").value
    let url = chkURL()
    document.getElementById("nLink").textContent = url + "?gain=" + document.getElementById("gain").value

}
function reset(){
    document.getElementById("prog").max = 0
    document.getElementById("db1").textContent = 0
}

function chkURL(){
    let url = document.getElementById("src").value
    if((url.match(/,/g) || []).length > 0){
        let count = document.getElementById("arrCount")
        let i = count.dataset.count - 1
        url = arr2[i]
    }
    return url
}
function copyLink(){
    navigator.clipboard.writeText(document.getElementById("nLink").innerText);
}
function sortHistoryDown(){
    let arr = document.getElementById("codeStash").innerText.split(",")
    arr.sort().reverse()
    document.getElementById("codeStash").innerText = arr.join(",")
}
function sortHistoryUp(){
    let arr = document.getElementById("codeStash").innerText.split(",")
    arr.sort()
    document.getElementById("codeStash").innerText = arr.join(",")
}
function copyHistory(){
    let stash = document.getElementById("codeStash").innerText
    if(stash.slice(-1) == ","){
        navigator.clipboard.writeText(stash.replace(/.$/, ""))
    } else navigator.clipboard.writeText(stash)

}
</script>

</html>
