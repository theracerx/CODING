<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family:Arial, Helvetica, sans-serif;
    }
    #startScreen{
        position: absolute;
        top:0;
        left:0;
        background: rgba(124, 124, 124, .75);
        width: 100%;
        height: 100%;
        z-index: 999;
    }
    #startBtn{
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: auto;
        width: 200px;
        height: 100px;
        font-size: xxx-large;
    }
    #uploadBinHead{
        display: block;
        text-align: center;
        font-size: xx-large;
        margin: 0 auto;
    }
    #uploadBin{
        display: block;
        margin: 0 auto;
        background-color: lightgray;
    }
    #relativePathCont{
        display: block;
        text-align: center;
        font-size: large;
        margin: 10px auto;
    }
    #relativePath{
        width: 40vw;
    }
    #normalizeBtn{
        display: block;
        margin: 0 auto;
    }
    #arrCount{
        display: block;
        text-align: center;
        margin: 0 auto;
        margin-top: 10px;
    }
    #cAudHead{
        display: block;
        text-align: center;
        margin: 10px auto;
    }
    #cAud{
        display: block;
        text-align: center;
        margin: 0 auto;
        font-style: italic;
    }
    #playerCont{
        display: flex;
    }
    #sideA{
        width: 50vw;
    }
    #sideB{
        width: 50vw;
    }
    audio{
        width:-webkit-fill-available;
    }
    #audioSelectCont{
        display: block;
        width: 100vw;
    }
    #resetDbBtn, #db1, #db2{
        float: right;
    }
    #db2{
        visibility: hidden;
    }
    .tempHidden{
        opacity: 65%;
        pointer-events: none;
    }
    /* progress::-webkit-progress-bar {background-color: black; width: 100%;} */
    /* progress {background-color: black;} */
    progress::-webkit-progress-bar {
        background: linear-gradient(to right, #3fffa2 0%, #ffdb3a 50%, #e5405e 100%) !important;
        width: 100%;}
    progress {
        background: linear-gradient(to right, #3fffa2 0%, #ffdb3a 50%, #e5405e 100%) !important;
    }

    /* value: */
    progress::-webkit-progress-value {
        transition: all .1s ease-in;
        background: linear-gradient(to right, #fcfcfc00 95%, #000000 100%) !important;
        /* width: 10px !important; */
    }
    /* progress::-webkit-progress-value {background: linear-gradient(to right, #e5405e 0%, #ffdb3a 45%, #3fffa2 100%) !important;} */
    /* progress::-moz-progress-bar {background-color: blue !important;} */
    /* progress {color: red !important;} */
</style>
<body>
    
    <label id="uploadBinHead" for="file[]">Select audio to normalize:</label>
    <input id="uploadBin" name=file[] type="file" multiple accept="audio/*">
    
    <div id="relativePathCont">
        <label for="relativePath">Relative path:</label>
        <input id="relativePath" type="text" placeholder="../Artist/Album/src">
    </div>

    <marquee>ඞඞඞ not 100% accurate ඞඞඞ </marquee>
    <marquee direction="right">ඞඞඞ NO SPECIAL CHARACTERS PLS!!!ඞඞඞ </marquee>

    <button id="normalizeBtn" onclick="checkUploads()"> >>> <strong>Normalize</strong> <<< </button>
    <span id="arrCount" data-count="0"></span>
    <h3 id="cAudHead">Current audio:</h3>
    <p id="cAud">null</p>
    <div id="playerCont">
        <div id="sideA">
            <h1>Original:</h1>
            <audio id="pl1" class="tempHidden" controls></audio>
            <br><!-- FOR DECIBEL DISPLAY -->
            <label for="prog">Decibel meter:</label>
            <progress id="prog" value="30" max="70"></progress> 
            <span id="db2"> 100 </span>
            <span id="db1"> ± 0 </span>
            <br>
        </div>
        <div id="sideB">
            <h1>Normalized:</h1>
                <audio id="pl2" class="tempHidden" controls></audio>

                <label for="gain">Gain</label>
                <input id="gain" class="tempHidden" type="number" placeholder="1" value="1" onkeyup="updateGain()" >
                <button class="tempHidden" onpointerup="updateGainFinal()">Save</button>
        </div>
    </div>
    <br>
    <div id="audioSelectCont">
        <!-- <button></button>  auto add buttons per audio converted-->
    </div>


    <h2 id="codeStashHead">History:</h2>
    <button onpointerup="sortHistoryUp()">Sort Up</button>
    <button onpointerup="sortHistoryDown()">Sort Down</button>
    <button onpointerup="copyHistory()">Copy History</button>
    <div id="codeStash"></div>
</body>
<script>
var audGainNode
var audSrcNode0
var audSrcNode1
var eventSetup
var processAud
var processedAud


function start(){
    document.getElementById("startScreen").remove()
    window.audioCtx = new AudioContext()
}
async function checkUploads(){
    window.audioCtx = new AudioContext()
    let uploads = document.getElementById("uploadBin")
    let arrCount = document.getElementById("arrCount")
    let codeStash = document.getElementById("codeStash")
    if (uploads.files.length !=0){
        document.getElementById("normalizeBtn").disabled = true
        document.getElementById("uploadBin").disabled = true
        let limit = uploads.files.length

        arrCount.textContent = "converting (0/" + (limit) + ")"
        arrCount.dataset.max = limit
        arrCount.dataset.count = processAud = processedAud = 0

        codeStash.array = []

        let i = 0;
        // let errCount = 0
        let test = (i)=>{
            return new Promise ((resolve)=>{
                setTimeout(async ()=>{


                    // let arr = document.getElementById("codeStash").innerText.split(`",`)


                    // console.log(processAud,processedAud)
                    if(processedAud != processAud){
                        console.log("not done")
                        await test(i)
                        resolve()
                    } else {
                        console.log("done")
                        resolve()
                    }
                }, 500)
            })
        }
        while (i < limit) {
            console.log("-------------------")
            console.log("pos" + i)
            nextArray()
            processAud++
            await test(i)
            i++
        }

        let arr = document.getElementById("codeStash").innerText.split(`",`)
        if(arr.length != limit + 1){ //1 due to split adding and empty item like "" only
            alert("ERROR ERROR")
        } else {
            console.log("-------------------")
            console.log("FINISHED")
            arrCount.remove()
            let list = [...document.getElementsByClassName("tempHidden")]
            for(let i=0;i<list.length;i++){
                list[i].className = ""
            }

            document.getElementById("codeStashHead").textContent = "History (" + limit + ") :"
            let finish = new Audio("finish.mp3")
            finish.volume = 0.5
            finish.play()
        }
    
    
    } else {
        alert("No files uploaded")
    }
}

function convert(obj){
    let src = URL.createObjectURL(obj)
    let player = document.getElementsByTagName("audio")
    let normalGain
    player[0].src = src
    fetch(player[0].src)
    .then(res => res.blob())
    .then(blob => blob.arrayBuffer())
    .then(buf => audioCtx.decodeAudioData(buf))
    .then(decodedData => {
        // Normalize calculations
        var decodedBuffer = decodedData.getChannelData(0);
        var sliceLen = Math.floor(decodedData.sampleRate * 0.05);
        var averages = [];
        var sum = 0.0;
        for (var i = 0; i < decodedBuffer.length; i++) {
            sum += decodedBuffer[i] ** 2; 
            if (i % sliceLen === 0) {
                sum = Math.sqrt(sum / sliceLen);
                averages.push(sum);
                sum = 0;
            }
        }
        // Ascending sort of the averages array
        averages.sort(function(a, b) { return a - b; });
        // Take the average at the 95th percentile
        var a = averages[Math.floor(averages.length * 0.95)];

        //set new gain
        normalGain = ((1.0 / a) / 10).toPrecision(4)

        //setup Normalized player
        player[1].src = src
        document.getElementById("gain").value = normalGain
        let url = obj.name + "?gain=" + normalGain

       url = String.raw`${url}`.replaceAll("\\","/")
       console.log(url)

        // document.getElementById("nLink").textContent = url
        let stash = document.getElementById("codeStash")
        // let stash2 = document.getElementById("codeStash2")
        // let dl = document.createElement("dl")
        
        
        if(!stash.textContent.includes(url)){ //only saves once in history
            let path = document.getElementById("relativePath").value
            path = String.raw`${path}`.replaceAll("\\","/")
            
            if(path != "" && path.slice(-1) != "/"){
                path = path + "/"
            }
            stash.textContent = stash.textContent + `"` + path + url + `",`
            stash.array.push(`"` + path + url + `"`)
            // dl.textContent = `"` + path + url + `",`
            // stash2.append(dl)
        }


        //set AudioSourceNode
        if(!audSrcNode0){
            audSrcNode0 = audioCtx.createMediaElementSource(player[0]);
        }
        if(!audSrcNode1){
            audSrcNode1 = audioCtx.createMediaElementSource(player[1]);
        }
    
        //set GainNode
        if(!audGainNode){
            audGainNode = audioCtx.createGain()
        }
        audGainNode.gain.value = normalGain
        
        //generate new Button for audio
        let nBtn = document.createElement("button")
        let br = document.createElement("br")
        nBtn.id = obj.name
        player[1].dataset.src = obj.name
        document.getElementById("cAud").textContent = obj.name
        nBtn.textContent = obj.name
        nBtn.dataset.gain  = normalGain
        let btnFunc = ()=>{
            player[0].src = src
            player[1].src = src
            player[1].dataset.src = obj.name
            document.getElementById("gain").value = nBtn.dataset.gain 
            document.getElementById("cAud").textContent = obj.name
            audGainNode.gain.value = nBtn.dataset.gain 
            player[1].play()
        }
        nBtn.onpointerup = btnFunc
        nBtn.onkeyup = btnFunc
        let audBtns = document.getElementById("audioSelectCont")
        audBtns.append(nBtn)
        audBtns.append(br)




        //set processor //FOR SHOWING DECIBELS
        let processor = audioCtx.createScriptProcessor(2048, 1, 1)
        processor.onaudioprocess = function(evt){
            var input = evt.inputBuffer.getChannelData(0)
            , len = input.length   
            , total = i = 0
            , rms;
            while ( i < len ) total += Math.abs( input[i++] );
            rms = Math.sqrt( total / len );

            let db = Math.round(rms * 100 * audGainNode.gain.value)
            document.getElementById("prog").value = db
            document.getElementById("db1").textContent = "± " + db

        };
        //setup connect and disconnect funcs

        let connectNode0 = ()=>{
            audGainNode.gain.value = 1
            console.log("connecting node")
            audSrcNode0.connect(audGainNode)
            audGainNode.connect(audioCtx.destination)
            audSrcNode0.connect(processor)
            processor.connect(audioCtx.destination);
        }
        let disconnectNode0 = ()=>{
            console.log("disconnecting node")
            audSrcNode0.disconnect(audGainNode)
            audGainNode.disconnect(audioCtx.destination)
            audSrcNode0.disconnect(processor)
            processor.disconnect(audioCtx.destination);
        }
        
        let connectNode1 = ()=>{
            audGainNode.gain.value = document.getElementById("gain").value
            console.log("connecting node")
            audSrcNode1.connect(audGainNode)
            audSrcNode1.connect(processor)
            audGainNode.connect(audioCtx.destination)
            processor.connect(audioCtx.destination);
        }
        let disconnectNode1 = ()=>{
            console.log("disconnecting node")
            audSrcNode1.disconnect(audGainNode)
            audSrcNode1.disconnect(processor)
            audGainNode.disconnect(audioCtx.destination)
            processor.disconnect(audioCtx.destination);
        }

       
        //set Events
        if(!eventSetup){
            eventSetup = true

            player[0].addEventListener("play",async(e)=>{  // isSrcReady???
                // player[1].pause()
                connectNode0()
            })
            player[0].addEventListener("pause",async(e)=>{
                disconnectNode0()
            })
        
            player[1].addEventListener("play",async(e)=>{  // isSrcReady???
                // player[0].pause()
                connectNode1()
            })
            player[1].addEventListener("pause",async(e)=>{
                disconnectNode1()
            })
        
        }
        console.log("convert FINISH")
        processedAud++
    })
}
function nextArray(){
    let count = document.getElementById("arrCount")
    let uploads = document.getElementById("uploadBin")

    count.dataset.count++
    let i = count.dataset.count - 1
    convert(uploads.files[i])
    count.textContent = "converting (" + count.dataset.count + "/" + (uploads.files.length) + ")"
}

function updateGain(){
    let val = document.getElementById("gain").value
    if(isNaN(val)) return
    audGainNode.gain.value = val
}
function updateGainFinal(){
    let nGain = document.getElementById("gain").value
    let id = document.getElementById("pl2").dataset.src

    if(id){
        let btn = document.getElementById(id)
        let stash = document.getElementById("codeStash").textContent
        let target = id + "?gain=" + btn.dataset.gain
        let replacement = id + "?gain=" + nGain
        console.log({
            target:target,
            replacement:replacement
        })
        if(stash.includes(target)){
            console.log("YESSS")
            console.log(stash)
            stash.replaceAll(target, replacement)
            document.getElementById("codeStash").textContent = stash.replaceAll(target, replacement)
        }
        console.log("FINAL:")
        console.log(document.getElementById("codeStash").textContent)
        
        btn.dataset.gain = nGain
        console.log("gain updated???")
    } else throw new Error ("no Audio to be updated")

}

function sortHistoryDown(){
    let arr = document.getElementById("codeStash").array
    arr.sort().reverse()
    document.getElementById("codeStash").innerText = arr.join(`,`)
}
function sortHistoryUp(){
    let arr = document.getElementById("codeStash").array
    arr.sort()
    document.getElementById("codeStash").innerText = arr.join(`,`)
}
function copyHistory(){
    let stash = document.getElementById("codeStash").innerText
    if(stash.slice(-1) == ","){
        navigator.clipboard.writeText(stash.replace(/.$/, ""))
    } else navigator.clipboard.writeText(stash)

}


</script>

</html>
