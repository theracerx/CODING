    var x = window.x = new XMLHttpRequest();
    x.open('GET', 'https://data.gmanetwork.com/gno/rss/news/nation/feed.xml');
    // I put "XMLHttpRequest" here, but you can use anything you want.

    x.onload = function() {
        // for(let i=0;i<x.responseXML.getElementsByTagName("item").length;i++){
        let container = document.getElementById("newsG")
        for(let i=0;i<x.responseXML.getElementsByTagName("item").length;i++){
            let obj = {
                title:x.responseXML.getElementsByTagName("title")[i+1].innerHTML.substring(9,x.responseXML.getElementsByTagName("title")[i+1].innerHTML.length - 3),

                image:x.responseXML.getElementsByTagName("media:content")[i].innerHTML.substring(10,x.responseXML.getElementsByTagName("media:content")[i].innerHTML.length - 4),
            }
            let newsBox = document.createElement("article")
            newsBox.className = "newsBox"
            let h2 = document.createElement("p")
            h2.innerText = obj.title
            newsBox.append(h2)
            newsBox.innerHTML = newsBox.innerHTML + obj.description

            container.append(newsBox)
            console.log(obj.pubDate)
        }
    };
    x.send();
